name: Godot project validation
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 headless
        run: |
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import resources and validate GDScript
        run: |
          set -o pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:" import.log; then exit 1; fi
      - name: Scene smoke test
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 20 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:" smoke.log; then exit 1; fi
      - name: Night 1 outcome and evidence regression tests
        run: godot --headless --path . --script res://tests/night01_state_test.gd
      - name: Santelmo actor and reflection regression tests
        run: godot --headless --path . --script res://tests/santelmo_actor_test.gd
      - name: Procedural character animation smoke tests
        run: godot --headless --path . --script res://tests/folk_actors_test.gd
      - name: Bantay navigation and obstacle regression
        run: godot --headless --path . --script res://tests/bantay_route_test.gd
      - name: Bantay awareness regression
        run: godot --headless --path . --script res://tests/bantay_awareness_test.gd
      - name: Night 1 witness dialogue regression
        run: godot --headless --path . --script res://tests/night01_dialogue_test.gd
      - name: Nearby NPC interaction prompts
        run: godot --headless --path . --script res://tests/nearby_interaction_test.gd
      - name: Four-slot preparation and save regression
        run: godot --headless --path . --script res://tests/night01_inventory_test.gd
      - name: Offline accessibility preferences regression
        run: godot --headless --path . --script res://tests/preferences_test.gd
      - name: Courage and safe retry regression
        run: godot --headless --path . --script res://tests/night01_courage_test.gd
      - name: Morning outcome world consistency regression
        run: godot --headless --path . --script res://tests/night01_aftermath_test.gd
      - name: Full Night 1 scene-to-outcome integration loop
        run: godot --headless --path . --script res://tests/night01_flow_test.gd
      - name: Lola hut prologue, interactive props and migration
        run: godot --headless --path . --script res://tests/night01_prologue_test.gd
      - name: Offline save corruption and backup recovery
        run: godot --headless --path . --script res://tests/night01_save_recovery_test.gd
      - name: Mobile overlay, focus release and HUD scroll regression
        run: godot --headless --path . --script res://tests/night01_hud_test.gd
      - name: Original offline ambience and audio-options regression
        run: godot --headless --path . --script res://tests/living_ambience_test.gd
      - name: Source-aware Night 1 journal and single bestiary entry
        run: godot --headless --path . --script res://tests/night01_journal_test.gd
      - name: Night 1 speaker portraits and cinematic dialogue progression
        run: godot --headless --path . --script res://tests/night01_cinematic_test.gd
      - name: Cinematic camera actor focus, reversibility and facial acting
        run: godot --headless --path . --script res://tests/night01_camera_test.gd
      - name: Lightweight day and night ambience lighting
        run: godot --headless --path . --script res://tests/barrio_lighting_test.gd
      - name: Original shaped river banca, outrigger and water motion
        run: godot --headless --path . --script res://tests/river_banca_test.gd
      - name: Distinct Barrio Lawom environmental storytelling
        run: godot --headless --path . --script res://tests/barrio_details_test.gd
      - name: Stage 3 mobile HUD spacing and safe landing beacon
        run: godot --headless --path . --script res://tests/night01_stage3_hud_test.gd
      - name: Actual guide portraits and sculpted mangrove/nipa visuals
        run: godot --headless --path . --script res://tests/night01_mangrove_art_test.gd
      - name: Functional title, responsive UI and real-world art integration
        run: godot --headless --path . --script res://tests/night01_title_and_art_test.gd
      - name: Confirmed save-safe navigation between gameplay and landing page
        run: godot --headless --path . --script res://tests/night01_navigation_test.gd
      - name: G6 imported illustrated characters, village, and world materials
        run: godot --headless --path . --script res://tests/night01_illustrated_art_test.gd
      - name: Kapre Night 2 evidence, route safety, negotiation and save state
        run: godot --headless --path . --script res://tests/night02_state_test.gd
      - name: Kapre Night 2 real interactive scene flow and Android UI
        run: godot --headless --path . --script res://tests/night02_scene_test.gd
      - name: Architectural cohesion of shore, boat, landing and authentic houses
        run: godot --headless --path . --script res://tests/night01_world_cohesion_test.gd
