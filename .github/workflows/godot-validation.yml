name: Godot project validation
on:
  push:
    branches: [main, 'feature/**']
  # Push CI already verifies feature branches. PR validation is reserved
  # for main-bound integrations, preventing duplicate runs on draft feature PRs.
  pull_request:
    branches: [main]
  workflow_dispatch:
# Only the newest validation for a given push or PR matters. Prevent earlier
# hung dummy-renderer jobs from accumulating throughout chapter development.
concurrency:
  group: tabitabi-godot-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 headless
        run: |
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import resources and validate GDScript
        run: |
          set -o pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:" import.log; then exit 1; fi
      - name: Scene smoke test
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 20 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:" smoke.log; then exit 1; fi
      - name: Night 1 outcome and evidence regression tests
        run: godot --headless --path . --script res://tests/night01_state_test.gd
      - name: Santelmo actor and reflection regression tests
        run: godot --headless --path . --script res://tests/santelmo_actor_test.gd
      - name: Procedural character animation smoke tests
        run: godot --headless --path . --script res://tests/folk_actors_test.gd
      - name: Bantay navigation and obstacle regression
        run: godot --headless --path . --script res://tests/bantay_route_test.gd
      - name: Bantay awareness regression
        run: godot --headless --path . --script res://tests/bantay_awareness_test.gd
      - name: Night 1 witness dialogue regression
        run: godot --headless --path . --script res://tests/night01_dialogue_test.gd
      - name: Nearby NPC interaction prompts
        run: godot --headless --path . --script res://tests/nearby_interaction_test.gd
      - name: Four-slot preparation and save regression
        run: godot --headless --path . --script res://tests/night01_inventory_test.gd
      - name: Offline accessibility preferences regression
        run: godot --headless --path . --script res://tests/preferences_test.gd
      - name: Same actionable pause and settings across title and all seven nights
        run: timeout --signal=TERM --kill-after=8s 180s godot --headless --audio-driver Dummy --path . --script res://tests/shared_options_all_nights_test.gd
      - name: Movable joystick and solid world collision all nights
        run: godot --headless --path . --script res://tests/movement_world_collision_test.gd
      - name: Real visual-depth regression from Android screenshots (shelter / Kapre / Lola)
        run: godot --headless --path . --script res://tests/visual_depth_screenshot_test.gd
      - name: All seven nights rooted actors, real building collisions and save-position safety
        run: godot --headless --path . --script res://tests/world_depth_all_nights_test.gd
      - name: Courage and safe retry regression
        run: godot --headless --path . --script res://tests/night01_courage_test.gd
      - name: Morning outcome world consistency regression
        run: godot --headless --path . --script res://tests/night01_aftermath_test.gd
      - name: Full Night 1 scene-to-outcome integration (three isolated outcomes)
        timeout-minutes: 12
        run: |
          set -euo pipefail
          # The dummy headless renderer emitted repeated null-mesh errors on
          # repeated 3D scene construction; use Mesa/OpenGL inside Xvfb instead.
          command -v xvfb-run
          for result in resolve drive_away partial; do
            echo "::group::Full Night 1 story outcome: $result"
            timeout --signal=TERM --kill-after=10s 180s xvfb-run -a \
              godot --rendering-method gl_compatibility --rendering-driver opengl3 \
              --path . --script res://tests/night01_flow_test.gd -- "$result"
            echo "::endgroup::"
          done
      - name: Lola hut prologue, interactive props and migration
        run: godot --headless --path . --script res://tests/night01_prologue_test.gd
      - name: Offline save corruption and backup recovery
        run: godot --headless --path . --script res://tests/night01_save_recovery_test.gd
      - name: Mobile overlay, focus release and HUD scroll regression
        run: godot --headless --path . --script res://tests/night01_hud_test.gd
      - name: Original offline ambience and audio-options regression
        run: godot --headless --path . --script res://tests/living_ambience_test.gd
      - name: Source-aware Night 1 journal and single bestiary entry
        run: godot --headless --path . --script res://tests/night01_journal_test.gd
      - name: Night 1 speaker portraits and cinematic dialogue progression
        run: godot --headless --path . --script res://tests/night01_cinematic_test.gd
      - name: Shared Night 1-2 dialogue easing, portraits and camera transition regression
        run: godot --headless --path . --script res://tests/shared_dialogue_motion_test.gd
      - name: Night 4 and 7 shared cinematic fades, choices, HUD recovery and reduced-motion
        run: godot --headless --path . --script res://tests/night04_night07_dialogue_transition_test.gd
      - name: Cinematic camera actor focus, reversibility and facial acting
        run: godot --headless --path . --script res://tests/night01_camera_test.gd
      - name: Lightweight day and night ambience lighting
        run: godot --headless --path . --script res://tests/barrio_lighting_test.gd
      - name: Original shaped river banca, outrigger and water motion
        run: godot --headless --path . --script res://tests/river_banca_test.gd
      - name: Distinct Barrio Lawom environmental storytelling
        run: godot --headless --path . --script res://tests/barrio_details_test.gd
      - name: Stage 3 mobile HUD spacing and safe landing beacon
        run: godot --headless --path . --script res://tests/night01_stage3_hud_test.gd
      - name: Actual guide portraits and sculpted mangrove/nipa visuals
        run: godot --headless --path . --script res://tests/night01_mangrove_art_test.gd
      - name: Functional title, responsive UI and real-world art integration
        run: godot --headless --path . --script res://tests/night01_title_and_art_test.gd
      - name: Confirmed save-safe navigation between gameplay and landing page
        run: godot --headless --path . --script res://tests/night01_navigation_test.gd
      - name: G6 imported illustrated characters, village, and world materials
        run: godot --headless --path . --script res://tests/night01_illustrated_art_test.gd
      - name: Kapre Night 2 evidence, route safety, negotiation and save state
        run: godot --headless --path . --script res://tests/night02_state_test.gd
      - name: Kapre Night 2 real interactive scene flow and Android UI
        run: godot --headless --path . --script res://tests/night02_scene_test.gd
      - name: Kapre Night 2 unlock and QA preview on fresh installs
        run: godot --headless --path . --script res://tests/night02_unlock_test.gd
      - name: Tikbalang Night 3 full evidence, route puzzle, retry, endings and save
        run: godot --headless --path . --script res://tests/night03_state_test.gd
      - name: Tikbalang Night 3 original art, shared cinematic HUD and REAL scene flow
        run: godot --headless --path . --script res://tests/night03_scene_test.gd
      - name: Tikbalang Night 3 locked title and genuine chapter unlock
        run: godot --headless --path . --script res://tests/night03_unlock_test.gd
      - name: Real physical Kapre to Tikbalang ridge round-trip scene streaming
        timeout-minutes: 2
        run: |
          # Real scene transitions remain tested. CI disables only *playback*
          # on a host without an audio device; renderer/story behavior is
          # identical and the main Android emulator tests audiovisual boot.
          timeout --signal=TERM --kill-after=8s 75s \
            godot --headless --audio-driver Dummy --path . \
            --script res://tests/night03_connected_playthrough_test.gd
      - name: Nights 1–4 lit windows and reduced street residents
        run: godot --headless --path . --script res://tests/nighttime_windows_test.gd
      - name: Night 4 lamay witness, defense, retry and outcome state
        run: godot --headless --path . --script res://tests/night04_state_test.gd
      - name: Night 4 original wake decor, audio and three physical threat tells
        run: godot --headless --path . --script res://tests/night04_vigil_immersive_test.gd
      - name: Night 4 actual shared HUD, social investigation and wake siege scene
        timeout-minutes: 3
        run: |
          timeout --signal=TERM --kill-after=8s 150s godot --headless --audio-driver Dummy --path . --script res://tests/night04_scene_test.gd
      - name: Night 5 Sigbin original canon, three light-shadow routes and independent save
        run: godot --headless --path . --script res://tests/night05_state_test.gd
      - name: Night 5 ACTUAL farm world, shared HUD, three group rescues and outcomes
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=8s 150s godot --headless --audio-driver Dummy --path . --script res://tests/night05_scene_test.gd
      - name: Night 6 flood reconstructions, witness privacy and river state
        run: godot --headless --path . --script res://tests/night06_state_test.gd
      - name: Night 6 live river chapter, Night 1 HUD and complete playthrough
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=8s 150s godot --headless --audio-driver Dummy --path . --script res://tests/night06_scene_test.gd
      - name: Night 7 final Keeper trial, survivor consent and independent save state
        run: godot --headless --path . --script res://tests/night07_state_test.gd
      - name: Night 7 real Balete scene, shared HUD, finale and playable epilogue
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=8s 150s godot --headless --audio-driver Dummy --path . --script res://tests/night07_scene_test.gd
      - name: Night 6 to Night 7 full connected round-trip, privacy and saved ledger
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=8s 150s godot --headless --audio-driver Dummy --path . --script res://tests/night07_connected_playthrough_test.gd
      - name: Restarting a new campaign resets all seven saves and the automatic world clock
        run: godot --headless --path . --script res://tests/night07_new_game_reset_test.gd
      - name: Final art movement, HUD held-state, mobile aim and Balete camera parity
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=8s 150s godot --headless --audio-driver Dummy --path . --script res://tests/final_polish_all_nights_test.gd
      - name: All seven chapter cinematic transitions, tap safety and reduced-motion behavior
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=8s 150s godot --headless --audio-driver Dummy --path . --script res://tests/shared_scene_transit_test.gd
      - name: Seven-night one-world graph and shared narrative integrity
        run: godot --headless --path . --script res://tests/connected_world_test.gd
      - name: Postgame automatic 24-minute day-night cycle, save and travel gate
        run: godot --headless --path . --script res://tests/postgame_clock_test.gd
      - name: Postgame living village NPC routines, riverside assets and endings
        run: godot --headless --path . --script res://tests/postgame_residents_test.gd
      - name: Verify Northern Grove art, shared materials and non-blocking scenery
        run: godot --headless --path . --script res://tests/north_grove_art_test.gd
      - name: Walk from Barrio Lawom to Kapre and back with intact saves
        run: godot --headless --path . --script res://tests/connected_world_playthrough_test.gd
      - name: Architectural cohesion of shore, boat, landing and authentic houses
        run: godot --headless --path . --script res://tests/night01_world_cohesion_test.gd
