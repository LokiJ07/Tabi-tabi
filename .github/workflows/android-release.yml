name: Signed Android release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example 1.0.0 or 1.0.0-rc.1)"
        required: true
        default: "1.0.0-rc.1"
        type: string
      publish:
        description: "Publish GitHub Release after signed-APK emulator smoke passes"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: tabi-tabi-production-signing
  cancel-in-progress: false

jobs:
  build-release:
    name: Export and verify production-signed APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GAME_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Require permanent signing key, never temporary debug keys
        env:
          KEYSTORE_BASE64: ${{ secrets.TABITABI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TABITABI_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.TABITABI_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEYSTORE_ALIAS" ]; then
            echo "::error::Configure TABITABI_KEYSTORE_BASE64, TABITABI_KEYSTORE_PASSWORD, and TABITABI_KEY_ALIAS in repo Actions Secrets before releasing."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform/build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Godot 4.3 and matched Android export templates
        run: |
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q templates.tpz -d exported
          cp exported/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Configure Godot Android editor paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          cp "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Import permanent release keystore (outside repository)
        env:
          KEYSTORE_BASE64: ${{ secrets.TABITABI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TABITABI_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.TABITABI_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import os, base64, pathlib
          raw = base64.b64decode(os.environ["KEYSTORE_BASE64"].strip(), validate=True)
          if len(raw) < 1000:
              raise SystemExit("Release keystore too small, refusing export")
          dest = pathlib.Path(os.environ["RUNNER_TEMP"]) / "tabitabi-release.p12"
          dest.write_bytes(raw)
          dest.chmod(0o600)
          print("Permanent signing key restored outside the checkout")
          PY
          keytool -list -keystore "$RUNNER_TEMP/tabitabi-release.p12" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" >/dev/null
          echo "PASS: Permanent release alias unlocks supplied keystore"

      - name: Set production APK version and stable Android package ID
        run: |
          python3 - <<'PY'
          import re, os, pathlib
          version = os.environ["GAME_VERSION"]
          m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:-rc\.(\d+))?", version)
          if not m:
              raise SystemExit("Only semantic versions 1.0.0 or 1.0.0-rc.1 are accepted")
          major, minor, patch = map(int, m.groups()[:3])
          rc = m.group(4)
          if major < 1 or minor >= 100 or patch >= 100 or (rc is not None and not 1 <= int(rc) <= 98):
              raise SystemExit("Invalid Android version sequence")
          version_code = major*1000000 + minor*10000 + patch*100 + (int(rc) if rc is not None else 99)
          if version_code >= 2100000000:
              raise SystemExit("Android version code too large")
          preset = pathlib.Path("export_presets.cfg")
          src = preset.read_text()
          if 'package/unique_name="org.tabitabi.nightone"' not in src or 'package/signed=true' not in src:
              raise SystemExit("Android package ID/signing contract changed; would break saves")
          src = re.sub(r'^version/code=.*$', f'version/code={version_code}', src, flags=re.M)
          src = re.sub(r'^version/name=.*$', f'version/name="{version}"', src, flags=re.M)
          preset.write_text(src)
          print("Version", version, "code", version_code, "package org.tabitabi.nightone")
          PY
      - name: Import Godot resources and export RELEASE (never debug)
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/tabitabi-release.p12
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.TABITABI_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.TABITABI_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build
          godot --headless --editor --path . --import --quit
          godot --headless --path . --export-release Android "build/Tabi-tabi-v$GAME_VERSION.apk"
          test -s "build/Tabi-tabi-v$GAME_VERSION.apk"

      - name: Verify APK signature, non-debuggable manifest and Android architectures
        run: |
          set -euo pipefail
          apk="build/Tabi-tabi-v$GAME_VERSION.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee build/apk-signature-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > build/android-release-badging.txt
          grep -F "package: name='org.tabitabi.nightone'" build/android-release-badging.txt
          if grep -q "application-debuggable" build/android-release-badging.txt; then
            echo "::error::APK manifest is debuggable; rejecting production release"
            exit 1
          fi
          unzip -Z1 "$apk" | grep -Fqx 'lib/arm64-v8a/libgodot_android.so'
          unzip -Z1 "$apk" | grep -Fqx 'lib/x86_64/libgodot_android.so'
          (cd build && sha256sum "Tabi-tabi-v$GAME_VERSION.apk" > SHA256SUMS.txt)
          echo "PASS: Release signed, non-debuggable and ARM64 supported"

      - uses: actions/upload-artifact@v4
        with:
          name: tabi-tabi-signed-release-apk
          path: |
            build/Tabi-tabi-v*.apk
            build/SHA256SUMS.txt
            build/apk-signature-verification.txt
            build/android-release-badging.txt
          if-no-files-found: error
          retention-days: 90

  release-emulator:
    name: Install actual signed release on Android 35 emulator
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GAME_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tabi-tabi-signed-release-apk
          path: build
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install release APK, open real title and check native crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb install -r "build/Tabi-tabi-v$GAME_VERSION.apk"
            adb logcat -c
            adb shell monkey -p org.tabitabi.nightone -c android.intent.category.LAUNCHER 1
            sleep 18
            adb shell pidof org.tabitabi.nightone
            adb exec-out screencap -p > build/android-signed-release-title.png
            test -s build/android-signed-release-title.png
            python3 - <<'PY'
            import struct
            with open('build/android-signed-release-title.png','rb') as f:
                header=f.read(24)
            assert header[:8]==b'\x89PNG\r\n\x1a\n'
            w,h=struct.unpack('>II',header[16:24])
            assert w>=700 and h>=400, (w,h)
            print('Release screenshot',w,h)
            PY
            adb logcat -d -v brief > build/android-signed-release-logcat.txt
            if grep -E 'FATAL EXCEPTION|SCRIPT ERROR:|ERROR: Failed to load script' build/android-signed-release-logcat.txt; then
              echo "::error::Release APK native crash or game script failure"
              exit 1
            fi
            echo "PASS: Production-signed release runs and renders Android title"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabi-tabi-signed-release-emulator-evidence
          path: |
            build/android-signed-release-title.png
            build/android-signed-release-logcat.txt
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish v-prefixed GitHub Release after all gates are green
    needs: [build-release, release-emulator]
    if: inputs.publish == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GAME_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tabi-tabi-signed-release-apk
          path: build
      - name: Publish immutable release asset (never overwrite a signed version)
        run: |
          set -euo pipefail
          tag="v$GAME_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump version; never silently replace an issued signed APK."
            exit 1
          fi
          cat > build/RELEASE_NOTES.md <<'EOF'
          TABI-TABI — complete seven-night Barrio Lawom story, playable Night 7 epilogue and connected free roam.

          Quality gates: Godot chapter/collision/HUD regressions and real Android emulator scene screenshots, plus this exact permanent-key signed RELEASE APK's signature, manifest, ARM64 package and emulator startup.

          Night 3 bridges now align to physical river boundaries; foot movement, multitouch controls and contextual identity cues updated across chapters.

          Save continuity: Android package ID remains org.tabitabi.nightone. Earlier *temporary/debug signed* APKs cannot be updated in place with this new release key; back up your saves before uninstalling. Future official releases using this SAME private keystore will update in place.

          Android hardware FPS, touch feel and long-session performance should be acceptance-tested on a real phone.
          EOF
          prerelease=""
          if [[ "$GAME_VERSION" == *"-rc."* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$tag" "build/Tabi-tabi-v$GAME_VERSION.apk" "build/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" --title "TABI-TABI $tag — Signed Android Release" \
            --notes-file build/RELEASE_NOTES.md $prerelease
          echo "Published stable-key signed Android APK at release $tag"
