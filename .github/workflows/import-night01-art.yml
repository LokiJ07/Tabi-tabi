name: Import Night 1 painted portraits
on:
  push:
    branches: ['feature/night1-foundation']
    paths: ['.github/workflows/import-night01-art.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify original TABI-TABI NPC art sheet
        env:
          SRC: https://d2ol7oe51mr4n9.cloudfront.net/user_3LqjsrQKSBpvUfZMk2JKybtBTyj/d7127818-bbd0-4f04-9c0b-65f3ffd28ad0.png
          SHA256: 37278a7860565bbc04a74b96e1ab15b7294095acc624b6dd1d90b9ca9805df38
        run: |
          set -euo pipefail
          mkdir -p assets/portraits
          curl -fL --retry 4 --retry-delay 3 "$SRC" -o assets/portraits/night01_painted_sheet.png
          echo "$SHA256  assets/portraits/night01_painted_sheet.png" | sha256sum -c -
          file assets/portraits/night01_painted_sheet.png
      - name: Commit artwork to the development branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portraits/night01_painted_sheet.png
          if git diff --cached --quiet; then
            echo "Portrait art already committed"
          else
            git commit -m "art(night1): import painted Lola Dado Mara Sabel portraits"
            git push origin HEAD:feature/night1-foundation
          fi
