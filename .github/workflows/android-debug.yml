name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: ['feature/**', 'fix/**']
permissions:
  contents: write
concurrency:
  group: night1-rolling-preview
  cancel-in-progress: true
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Godot 4.3
        run: |
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Install Android export templates
        run: |
          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q templates.tpz -d exported
          cp exported/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Create ephemeral test signing key
        run: |
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android -dname "CN=TabiTabi Debug, O=Development, C=PH"
      - name: Configure Godot Android editor paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          cp "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.3.tres"
      - name: Set monotonic Android QA version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path("export_presets.cfg")
          lines = path.read_text().splitlines()
          run = int(os.environ["GITHUB_RUN_NUMBER"])
          lines = [f"version/code={run}" if line.startswith("version/code=") else
                   f'version/name="0.18.2-connected-night06-road.{run}"' if os.environ.get("GITHUB_REF", "").endswith("night05-visible-night06-road-connection") and line.startswith("version/name=") else
                   f'version/name="0.18.0-sigbin-farm-qa.{run}"' if os.environ.get("GITHUB_REF", "").endswith("night05-sigbin-abandoned-farm") and line.startswith("version/name=") else
                   f'version/name="0.17.0-cinematic-creature.{run}"' if os.environ.get("GITHUB_REF", "").endswith("night04-cinematic-creature-presence") and line.startswith("version/name=") else
                   f'version/name="0.16.0-night4-animated-qa.{run}"' if os.environ.get("GITHUB_REF", "").endswith("night04-final-character-animation") and line.startswith("version/name=") else
                   f'version/name="0.15.0-wake-vigil-qa.{run}"' if os.environ.get("GITHUB_REF", "").endswith("night04-wake-immersive-vigil") and line.startswith("version/name=") else
                   f'version/name="0.14.0-lived-in-night-qa.{run}"' if os.environ.get("GITHUB_REF", "").endswith("nighttime-lived-in-village-nights1-4") and line.startswith("version/name=") else
                   f'version/name="0.13.0-night4-wake-qa.{run}"' if os.environ.get("GITHUB_REF", "").endswith("night04-manananggal-the-wake") and line.startswith("version/name=") else
                   f'version/name="0.12.0-nights123-25d.{run}"' if os.environ.get("GITHUB_REF", "").endswith("nights1-3-dimensional-art-pass") and line.startswith("version/name=") else
                   f'version/name="0.11.0-night3-qa.{run}"' if os.environ.get("GITHUB_REF", "").endswith("night03-tikbalang-connected") and line.startswith("version/name=") else
                   f'version/name="0.10.0-night2-qa.{run}"' if os.environ.get("GITHUB_REF", "").endswith("night2-kapre") and line.startswith("version/name=") else
                   f'version/name="0.9.0-night1-qa.{run}"' if line.startswith("version/name=") else
                   line for line in lines]
          path.write_text("\n".join(lines) + "\n")
          print("Android QA version", run)
          PY
      - name: Import project
        run: godot --headless --editor --path . --import --quit
      - name: Gate preview with same essential story and HUD regressions (bounded)
        run: |
          set -euo pipefail
          run_test() {
            echo "::group::Headless QA $1"
            timeout --signal=TERM --kill-after=8s 90s godot --headless --audio-driver Dummy --path . --script "$1"
            echo "::endgroup::"
          }
          run_test res://tests/night01_state_test.gd
          run_test res://tests/night01_inventory_test.gd
          run_test res://tests/preferences_test.gd
          run_test res://tests/night01_courage_test.gd
          run_test res://tests/night01_aftermath_test.gd
          # Complete Night 1 scene-to-outcome flow is already gated by
          # godot-validation.yml on this same commit; avoid running it twice
          # under this job's dummy renderer, which can hang emitting mesh errors.
          # Android emulator below verifies the actual launch and world.

          run_test res://tests/night01_prologue_test.gd
          run_test res://tests/night01_save_recovery_test.gd
          run_test res://tests/night01_hud_test.gd
          run_test res://tests/night01_stage3_hud_test.gd
          run_test res://tests/folk_actors_test.gd
          run_test res://tests/night01_cinematic_test.gd
          run_test res://tests/shared_dialogue_motion_test.gd
          run_test res://tests/night01_camera_test.gd
          run_test res://tests/barrio_lighting_test.gd
          run_test res://tests/river_banca_test.gd
          run_test res://tests/barrio_details_test.gd
          run_test res://tests/night01_mangrove_art_test.gd
          run_test res://tests/night01_title_and_art_test.gd
          run_test res://tests/night01_navigation_test.gd
          run_test res://tests/night01_illustrated_art_test.gd
          run_test res://tests/night02_state_test.gd
          run_test res://tests/night02_scene_test.gd
          run_test res://tests/night02_unlock_test.gd
          run_test res://tests/night03_state_test.gd
          run_test res://tests/night03_scene_test.gd
          run_test res://tests/night03_unlock_test.gd
          run_test res://tests/night03_connected_playthrough_test.gd
          run_test res://tests/nighttime_windows_test.gd
          run_test res://tests/night04_state_test.gd
          run_test res://tests/night04_scene_test.gd
          run_test res://tests/night04_vigil_immersive_test.gd
          run_test res://tests/night05_state_test.gd
          run_test res://tests/night05_scene_test.gd
          run_test res://tests/night06_state_test.gd
          run_test res://tests/night06_scene_test.gd
          run_test res://tests/night07_state_test.gd
          run_test res://tests/night07_scene_test.gd
          run_test res://tests/night07_connected_playthrough_test.gd
          run_test res://tests/connected_world_test.gd
          run_test res://tests/north_grove_art_test.gd
          run_test res://tests/connected_world_playthrough_test.gd
          run_test res://tests/night01_world_cohesion_test.gd
          run_test res://tests/living_ambience_test.gd
          run_test res://tests/night01_journal_test.gd
      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/tabi-tabi-night1-debug.apk
          test -s build/tabi-tabi-night1-debug.apk
      - name: Verify signed APK and architecture entries
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/tabi-tabi-night1-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/tabi-tabi-night1-debug.apk | head -n 4
          unzip -Z1 build/tabi-tabi-night1-debug.apk | grep -Fqx "lib/arm64-v8a/libgodot_android.so"
          unzip -Z1 build/tabi-tabi-night1-debug.apk | grep -Fqx "lib/x86_64/libgodot_android.so"
      - uses: actions/upload-artifact@v4
        with:
          name: tabi-tabi-night1-debug-apk
          path: build/tabi-tabi-night1-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish rolling Night 1 prerelease (direct APK URL)
        if: github.ref == 'refs/heads/feature/night1-foundation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view night1-dev >/dev/null 2>&1; then
            gh release create night1-dev --target "$GITHUB_SHA" --prerelease --title "TABI-TABI — Night 1 Development Preview" --notes "Experimental Android ARM64 debug build. Not a completed game or production release. Use for evaluation only; each CI run uses a temporary signing key, so different APKs may require uninstalling."
          fi
          gh release upload night1-dev build/tabi-tabi-night1-debug.apk --clobber
          echo "Direct APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/night1-dev/tabi-tabi-night1-debug.apk"
      - name: Publish rolling Night 2 Kapre preview (separate download)
        if: github.ref == 'refs/heads/feature/night2-kapre'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/tabi-tabi-night1-debug.apk build/tabi-tabi-night2-debug.apk
          if ! gh release view night2-dev >/dev/null 2>&1; then
            gh release create night2-dev --target "$GITHUB_SHA" --prerelease --title "TABI-TABI — Night 2 Kapre Development Preview" --notes "Experimental playable Kapre chapter. Chapter progression unlocks after Night 1. Use for Android playtesting; temporary CI debug signing may require uninstalling older QA builds."
          fi
          gh release upload night2-dev build/tabi-tabi-night2-debug.apk --clobber
          echo "Night 2 APK https://github.com/${GITHUB_REPOSITORY}/releases/download/night2-dev/tabi-tabi-night2-debug.apk"
  emulator-smoke:
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tabi-tabi-night1-debug-apk
          path: build
      - name: Enable Linux KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch Android APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android_emulator_smoke.sh
      - name: Save Android launch screenshot and crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabi-tabi-emulator-launch-evidence
          path: |
            build/android-night1-title.png
            build/android-night1-launch.png
            build/android-night1-village.png
            build/android-night1-qa-failed-*.png
            build/android-night1-connected-trail.png
            build/android-night1-shore-dock.png
            build/android-night1-night-river.png
            build/android-night2-intro.png
            build/android-night2-mango-day.png
            build/android-night2-witness.png
            build/android-night2-shelter-route.png
            build/android-night2-kapre-tree.png
            build/android-night2-dusk.png
            build/android-night2-shelter-night.png
            build/android-night2-return-trail.png
            build/android-night2-log.txt
            build/android-night3-intro.png
            build/android-night3-ridge-day.png
            build/android-night3-watchpost.png
            build/android-night3-watchpost-night.png
            build/android-night3-tikbalang-night.png
            build/android-night3-back-trail.png
            build/android-night4-intro.png
            build/android-night4-wake-day.png
            build/android-night4-courtyard.png
            build/android-night4-manananggal-night.png
            build/android-night4-wingbeat-followup.png
            build/android-night4-ridge-return.png
            build/android-night4-log.txt
            build/android-night5-intro.png
            build/android-night5-tracks-day.png
            build/android-night5-safe-gate.png
            build/android-night5-courtyard.png
            build/android-night5-sigbin-night.png
            build/android-night5-sigbin-motion.png
            build/android-night5-night06-road-connected.png
            build/android-night5-first-rescue-crossing.png
            build/android-night5-first-rescue-settled.png
            build/android-night5-log.txt
            build/android-night6-intro.png
            build/android-night6-archive-day.png
            build/android-night6-reconstruction-board.png
            build/android-night6-river-memory-night.png
            build/android-night6-farm-return-trail.png
            build/android-night6-log.txt
            build/android-night1-notebook.png
            build/android-night1-notebook-scrolled.png
            build/android-night1-preparation.png
            build/android-night1-options.png
            build/android-godot-renderer-log.txt
            build/android-night1-launch-log.txt
            build/android-display.txt
          if-no-files-found: warn
          retention-days: 7
